name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish server metadata
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify manifest versions
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node --print "require('./package.json').version")"
          manifest_version="$(node --print "require('./server.json').version")"
          manifest_package_version="$(node --print "require('./server.json').packages[0].version")"

          test "$package_version" = "$manifest_version"
          test "$package_version" = "$manifest_package_version"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$package_version"
          fi

      - name: Download verified MCP publisher
        shell: bash
        run: |
          set -euo pipefail

          archive="mcp-publisher_linux_amd64.tar.gz"
          url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"

          curl --fail --location --silent --show-error --output "$archive" "$url"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Validate server metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate and publish
        shell: bash
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ ! "$MCP_PRIVATE_KEY" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "MCP_PRIVATE_KEY must be the 64-character hexadecimal Ed25519 private seed." >&2
            exit 1
          fi

          ./mcp-publisher login dns \
            --domain rundum.immo \
            --private-key "$MCP_PRIVATE_KEY"
          ./mcp-publisher publish server.json

      - name: Verify published registry entry
        shell: bash
        run: |
          set -euo pipefail

          server_name="$(node --print "require('./server.json').name")"
          server_version="$(node --print "require('./server.json').version")"

          for attempt in {1..12}; do
            curl --fail --silent --show-error --get \
              --data-urlencode "search=${server_name}" \
              --output registry-response.json \
              https://registry.modelcontextprotocol.io/v0.1/servers

            if jq --exit-status \
              --arg name "$server_name" \
              --arg version "$server_version" \
              '.servers[]? | select(.server.name == $name and .server.version == $version)' \
              registry-response.json >/dev/null; then
              echo "Verified ${server_name}@${server_version} in the MCP Registry."
              exit 0
            fi

            echo "Registry entry is not visible yet (attempt ${attempt}/12)."
            sleep 10
          done

          echo "Published entry did not become visible within two minutes." >&2
          exit 1
